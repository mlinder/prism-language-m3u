name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: Pack
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
      # The trusted publisher may only stage; a maintainer approves each
      # version with 2FA on npmjs.com.
      - name: Stage on npm
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm stage publish ./*.tgz
